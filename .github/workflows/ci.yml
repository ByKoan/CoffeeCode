name: CI

# Ejecuta los tests y compila la aplicación en cada push a las ramas
# principales y en cada pull request.
on:
  push:
    branches: [production, development]
  pull_request:

# Cancela ejecuciones antiguas del mismo ref si llega una nueva.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Tests unitarios. No compila la app ni SDL (COFFEE_BUILD_APP=OFF), así que es
  # rápido y robusto: solo descarga la pequeña librería ctests y compila los
  # módulos puros (structs, buffer, lexer).
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (sin SDL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (solo tests)
        run: >
          cmake -B build-tests
          -DCMAKE_BUILD_TYPE=Debug
          -DCOFFEE_BUILD_APP=OFF
          -DCOFFEE_BUILD_TESTS=ON

      - name: Compilar tests
        run: cmake --build build-tests -j

      - name: Ejecutar tests (CTest)
        run: ctest --test-dir build-tests --output-on-failure

  # ---------------------------------------------------------------------------
  # Build de la app en Linux (GCC). SDL3 se compila desde fuente, así que hacen
  # falta las cabeceras de X11/Wayland y audio.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build app (Linux / GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de SDL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libgbm-dev \
            libdrm-dev libasound2-dev libpulse-dev

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOFFEE_BUILD_TESTS=OFF

      - name: Compilar
        run: cmake --build build -j

  # ---------------------------------------------------------------------------
  # Build de la app en Windows con MinGW-w64 (GCC), el mismo toolchain que se usa
  # en local (TDM-GCC). Se instala vía MSYS2; usamos su shell para todos los
  # pasos de build.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build app (Windows / MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar MinGW-w64 (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configurar
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCOFFEE_BUILD_TESTS=OFF

      - name: Compilar
        run: cmake --build build -j
